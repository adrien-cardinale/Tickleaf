[package]
name = "tauri-plugin-geofence"
version = "0.1.0"
description = "Android geofencing for Tickleaf tasks"
edition = "2021"
publish = false
links = "tauri-plugin-geofence"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
